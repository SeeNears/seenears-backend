spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB

  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:seenears}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:seenears}
    password: ${MYSQL_PASSWORD:seenears1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}

app:
  internal-api-key: ${INTERNAL_API_KEY:seenears-local-internal-api-key}
  upload:
    voice-record-dir: ${VOICE_RECORD_UPLOAD_DIR:uploads/voice-records}
  push:
    fcm:
      enabled: ${FCM_ENABLED:false}
      scheduler-enabled: ${FCM_SCHEDULER_ENABLED:false}
      batch-size: ${FCM_BATCH_SIZE:20}
      fixed-delay-ms: ${FCM_FIXED_DELAY_MS:60000}
      service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
